<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <h1>⚙️ Library Management</h1>
        <button id="logout-btn" class="btn-danger">Log Out</button>
    </header>

    <main class="dashboard-container">
        <!-- Section 1A: Register Member -->
        <section class="dash-card">
            <h2>Register Member</h2>
            <form id="add-member-form">
                <div class="form-group">
                    <input type="text" id="member-name" placeholder="Member Name (e.g. Silas Montclair)" required>
                </div>
                <button type="submit" class="btn-primary">Add Member</button>
            </form>
        </section>

        <!-- Section 1B: Registered Members Management -->
        <section class="dash-card">
            <h2>Registered Members</h2>
            <div id="members-list">
                <p class="loading-text">Loading members...</p>
            </div>
        </section>

        <!-- Section 2A: Add New Book to Catalog (No stock needed) -->
        <section class="dash-card">
            <h2>Add New Book to Catalog</h2>
            <form id="add-catalog-book-form">
                <div class="form-group">
                    <input type="text" id="new-catalog-title" placeholder="Book Title / Tome Name" required>
                </div>
                <button type="submit" class="btn-primary">Add to Catalog</button>
            </form>
        </section>

        <!-- Section 2B: Update Existing Book Inventory Quantity -->
        <section class="dash-card">
            <h2>Update Book Inventory Quantity</h2>
            <form id="update-stock-form">
                <div class="form-group">
                    <select id="update-book-select" required>
                        <option value="">Select Book to Update...</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="additional-stock-input" placeholder="Copies to Add (+/-)" required>
                </div>
                <button type="submit" class="btn-primary">Update Quantity</button>
            </form>
        </section>

        <!-- Section 3: Checkout Book -->
        <section class="dash-card">
            <h2>Checkout Book to Character</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <select id="checkout-book-select" required>
                        <option value="">Select Book...</option>
                    </select>
                </div>
                <div class="form-group">
                    <select id="checkout-member-select" required>
                        <option value="">Select Character...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rental-days-input">Due in (X Days):</label>
                    <input type="number" id="rental-days-input" value="3" min="1" required>
                </div>
                <button type="submit" class="btn-primary">Checkout Book</button>
            </form>
        </section>

        <!-- Section 4: Admin Inventory View -->
        <section class="dash-card full-width">
            <h2>Live Inventory Stock</h2>
            <div id="admin-inventory-list">
                <p class="loading-text">Loading inventory...</p>
            </div>
        </section>

        <!-- Section 5: Active Rentals & Returns Ledger -->
        <section class="dash-card full-width">
            <h2>Active Rentals & Returns Ledger</h2>
            <div id="rentals-list">
                <p class="loading-text">Loading active rentals...</p>
            </div>
        </section>
    </main>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>

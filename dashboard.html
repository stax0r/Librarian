<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <h1>⚙️ Library Management</h1>
        <div class="header-actions">
            <button id="open-member-modal-btn" class="btn-primary">+ Register Member</button>
            <button id="open-book-modal-btn" class="btn-primary">+ Add Book to Catalog</button>
            <button id="logout-btn" class="btn-danger">Log Out</button>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Section 1: Registered Members -->
        <section class="dash-card">
            <h2>Registered Members</h2>
            <div id="members-list" class="card-scroll-area">
                <p class="loading-text">Loading members...</p>
            </div>
        </section>

        <!-- Section 2: Live Inventory Stock -->
        <section class="dash-card">
            <h2>Live Inventory Stock</h2>
            <div id="admin-inventory-list" class="card-scroll-area">
                <p class="loading-text">Loading inventory...</p>
            </div>
        </section>

        <!-- Section 3: Checkout Book -->
        <section class="dash-card">
            <h2>Checkout Book to Character</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <select id="checkout-book-select" required>
                        <option value="">Select Book...</option>
                    </select>
                </div>
                <div class="form-group">
                    <select id="checkout-member-select" required>
                        <option value="">Select Character...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="rental-days-input">Due in (X Days):</label>
                    <input type="number" id="rental-days-input" value="3" min="1" required>
                </div>
                <button type="submit" class="btn-primary">Checkout Book</button>
            </form>
        </section>

        <!-- Section 4: Active Rentals & Returns Ledger (Now standard card size) -->
        <section class="dash-card">
            <h2>Active Rentals & Returns Ledger</h2>
            <div id="rentals-list" class="card-scroll-area">
                <p class="loading-text">Loading active rentals...</p>
            </div>
        </section>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Modal: Register Member -->
    <div id="member-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Register New Member</h2>
            <form id="add-member-form" style="margin-top: 15px;">
                <div class="form-group">
                    <input type="text" id="member-name" placeholder="Member Name (e.g. Silas Montclair)" required>
                </div>
                <button type="submit" class="btn-primary">Save Member</button>
            </form>
        </div>
    </div>

    <!-- Modal: Add Book to Catalog -->
    <div id="book-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Add New Book to Catalog</h2>
            <form id="add-catalog-book-form" style="margin-top: 15px;">
                <div class="form-group">
                    <input type="text" id="new-catalog-title" placeholder="Book Title / Tome Name" required>
                </div>
                <button type="submit" class="btn-primary">Save to Catalog</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Catalog</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <h1>📜 Library Catalog</h1>
        <a href="login.html" class="btn-secondary">Staff Ledger</a>
    </header>

    <main class="container">
        <h2>Available Inventory</h2>
        <p class="subtitle" style="margin-bottom: 20px; color: #aaa;">Browse our collection, check availability, or
            search for a specific book.</p>

        <div class="catalog-search-container">
            <input type="text" id="book-search" placeholder="🔍 Search books by title..." autocomplete="off">
        </div>

        <div id="book-catalog" class="catalog-grid">
            <!-- Dynamic books rendered here -->
            <p class="loading-text">Fetching library records...</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div>Find me on Discord at <code>stax0r</code>.</div>
            <div>
                <a href="https://www.buymeacoffee.com/stax0r" target="_blank" class="donation-btn">🍺 Buy me a beer</a>
            </div>
        </div>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>

</html>
